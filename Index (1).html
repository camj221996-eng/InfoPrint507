<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphitech | Partes y Suministros para Impresoras</title>
  <meta name="description" content="Tintas, tóner, partes y suministros para impresoras. Graphitech - Panamá." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a56db;
      --primary-dark: #1e429f;
      --dark: #111827;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f9fafb;
      --card: #ffffff;
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 14px;
    }

    a { color: inherit; text-decoration: none; }

    /* ========== TOP BAR ========== */
    .topbar {
      background: var(--dark);
      color: #d1d5db;
      font-size: 12px;
      padding: 6px 0;
    }
    .topbar-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar a { color: #93c5fd; }
    .topbar a:hover { text-decoration: underline; }

    /* ========== HEADER ========== */
    header {
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 22px;
      color: var(--dark);
      flex-shrink: 0;
    }
    .logo img{height:46px;width:auto;display:block} .logo-icon{display:none}
    .search-form {
      flex: 1;
      max-width: 520px;
      position: relative;
    }
    .search-form input {
      width: 100%;
      padding: 10px 16px 10px 42px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      background: #f9fafb;
      transition: border-color .15s, background .15s;
    }
    .search-form input:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }
    .search-form svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .btn-cart {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-cart:hover { background: var(--primary-dark); }
    .cart-badge {
      background: white;
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }

    /* ========== NAV CATEGORIES ========== */
    .nav-cats {
      background: white;
      border-bottom: 1px solid var(--border);
    }
    .nav-cats-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-cats-inner::-webkit-scrollbar { display: none; }
    .cat-chip {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .cat-chip:hover, .cat-chip.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* ========== LAYOUT ========== */
    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 16px 60px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 24px;
    }
    @media (max-width: 900px) {
      .page { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      height: fit-content;
      position: sticky;
      top: 80px;
    }
    .sidebar h3 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .sidebar-cat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13.5px;
      transition: background .12s;
    }
    .sidebar-cat:hover { background: #f3f4f6; }
    .sidebar-cat.active {
      background: #eff6ff;
      color: var(--primary);
      font-weight: 600;
    }
    .sidebar-cat .count {
      font-size: 12px;
      color: var(--muted);
      background: #f3f4f6;
      padding: 1px 7px;
      border-radius: 999px;
    }
    .sidebar-cat.active .count {
      background: #dbeafe;
      color: var(--primary);
    }

    /* ========== PRODUCTS ========== */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .results-count {
      font-size: 13px;
      color: var(--muted);
    }
    .sort-select {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      background: white;
      cursor: pointer;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .product-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow .2s, border-color .2s;
    }
    .product-card:hover {
      border-color: #c7d2fe;
      box-shadow: 0 4px 12px rgba(0,0,0,.06);
    }

    .product-image {
      height: 160px;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      position: relative;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }
    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .stock-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: #d1fae5;
      color: #065f46;
    }
    .stock-tag.low {
      background: #fef3c7;
      color: #92400e;
    }
    .stock-tag.out {
      background: #fee2e2;
      color: #991b1b;
    }

    .product-body {
      padding: 12px 14px 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .product-category {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .product-name {
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 8px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 10px;
    }
    .product-price small {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }
    .btn-add {
      width: 100%;
      padding: 9px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-add:hover { background: var(--primary-dark); }
    .btn-add:disabled {
      background: #d1d5db;
      cursor: not-allowed;
    }

    /* ========== EMPTY / LOADING ========== */
    .state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .state .icon { font-size: 40px; margin-bottom: 12px; }

    /* ========== CART DRAWER ========== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: .25s;
    }
    .overlay.open { opacity: 1; visibility: visible; }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(380px, 100%);
      height: 100%;
      background: white;
      z-index: 110;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      box-shadow: -8px 0 30px rgba(0,0,0,.1);
    }
    .overlay.open .cart-drawer { transform: translateX(0); }

    .cart-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cart-header h2 { font-size: 16px; font-weight: 700; }
    .close-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--muted);
      line-height: 1;
    }

    .cart-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 18px;
    }
    .cart-empty {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
    }

    .cart-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .cart-item:last-child { border-bottom: none; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cart-item-price { font-size: 12px; color: var(--muted); }
    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }
    .qty-btn {
      width: 26px;
      height: 26px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qty-btn:hover { background: #f3f4f6; }
    .qty-num { min-width: 20px; text-align: center; font-weight: 600; font-size: 13px; }
    .remove-item {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 12px;
      cursor: pointer;
      margin-left: auto;
    }

    .cart-footer {
      padding: 16px 18px;
      border-top: 1px solid var(--border);
      background: #f9fafb;
    }
    .cart-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .btn-whatsapp {
      width: 100%;
      padding: 12px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .15s;
    }
    .btn-whatsapp:hover { background: #1da851; }
    .btn-whatsapp:disabled {
      background: #d1d5db;
      cursor: not-allowed;
    }

    /* ========== FOOTER ========== */
    footer {
      background: var(--dark);
      color: #9ca3af;
      padding: 32px 16px;
      text-align: center;
      font-size: 13px;
    }
    footer a { color: #93c5fd; }
    footer strong { color: white; }

    /* ========== TOAST ========== */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--dark);
      color: white;
      padding: 10px 20px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 13px;
      z-index: 200;
      opacity: 0;
      transition: .3s;
      box-shadow: 0 4px 20px rgba(0,0,0,.2);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Mobile header adjustments */
    @media (max-width: 640px) {
      .header-main { gap: 12px; }
      .logo span { display: none; }
      .search-form { max-width: none; }
      .products-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .product-image { height: 120px; font-size: 36px; }
      .product-name { font-size: 12.5px; }
      .product-price { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-inner">
      <span>Envíos a todo Panamá · Tel: <a href="tel:+50760023188">6002-3188</a></span>
      <span><a href="mailto:impresionesgraphitech@gmail.com">impresionesgraphitech@gmail.com</a></span>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="header-main">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="Graphitech">
      </a>
      <div class="search-form">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="searchInput" placeholder="Buscar tintas, tóner, partes..." autocomplete="off">
      </div>

  <!-- Category chips -->
  <nav class="nav-cats">
    <div class="nav-cats-inner" id="navCats">
      <div class="cat-chip active" data-cat="">Todos</div>
    </div>
  </nav>

  <!-- Main -->
  <div class="page">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h3>Categorías</h3>
      <div id="sidebarCats"></div>
    </aside>

    <!-- Products -->
    <div>
      <div class="toolbar">
        <div class="results-count" id="resultsCount">Cargando...</div>
        <select class="sort-select" id="sortSelect">
          <option value="name">Nombre A-Z</option>
          <option value="price-asc">Precio: menor a mayor</option>
          <option value="price-desc">Precio: mayor a menor</option>
          <option value="stock">Mayor stock</option>
        </select>
      </div>
      <div class="products-grid" id="productsGrid">
        <div class="state"><div class="icon">⏳</div><p>Cargando productos...</p></div>
      </div>
    </div>
  </div>

  <!-- Cart -->
  <div class="overlay" id="cartOverlay">
    <div class="cart-drawer">
      <div class="cart-header">
        <h2>Tu carrito</h2>
        <button class="close-btn" id="closeCart">×</button>
      </div>
      <div class="cart-body" id="cartBody">
        <div class="cart-empty">Tu carrito está vacío</div>
      </div>
      <div class="cart-footer">
        <div class="cart-total-row">
          <span>Total</span>
          <span id="cartTotal">$0.00</span>
        </div>
        <button class="btn-whatsapp" id="checkoutBtn" disabled>
          📱 Pedir por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p><strong>Graphitech</strong> · Tel: <a href="tel:+50760023188">6002-3188</a> · 
      <a href="mailto:impresionesgraphitech@gmail.com">impresionesgraphitech@gmail.com</a></p>
    <p style="margin-top:6px;font-size:12px">© 2026 Graphitech · Panamá</p>
  </footer>

  <div class="toast" id="toast"></div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <script>
    firebase.initializeApp({ databaseURL: "https://graphitech-web-default-rtdb.firebaseio.com" });
    const db = firebase.database();

    let allProducts = [];
    let currentCat = '';
    let cart = JSON.parse(localStorage.getItem('graphitech_cart') || '{}');

    function normalizeCategory(cat) {
      if (!cat || !cat.trim()) return 'Otros';
      const c = cat.trim().toLowerCase();
      if (c.includes('tinta')) return 'Tintas';
      if (c.includes('estampado') || c.includes('dtf')) return 'Estampado DTF';
      if (c.includes('formato') || c.includes('vinil') || c.includes('banner') || c.includes('impesion') || c.includes('impresión formato')) return 'Formato Ancho / Vinil';
      if (c.includes('papel') || c.includes('pepel') || c.includes('tarjeta') || c.includes('libreta') || c.includes('ticket')) return 'Papelería';
      if (c.includes('ropa') || c.includes('tshirt') || c.includes('polo') || c.includes('chaleco') || c.includes('pantalon')) return 'Ropa / Textil';
      if (c.includes('bolsa')) return 'Bolsas';
      if (c.includes('publicitario') || c.includes('stand') || c.includes('roll')) return 'Publicitario';
      if (c.includes('servicio') || c.includes('arte')) return 'Servicios';
      if (c.includes('rotul')) return 'Rotulación';
      if (c.includes('sticker')) return 'Stickers';
      return cat.trim();
    }

    function getIcon(cat) {
      const map = {
        'Tintas': '💧', 'Estampado DTF': '👕', 'Formato Ancho / Vinil': '📐',
        'Papelería': '📄', 'Ropa / Textil': '👔', 'Bolsas': '🛍️',
        'Publicitario': '🪧', 'Servicios': '🎨', 'Rotulación': '✂️',
        'Stickers': '🏷️', 'Otros': '📦'
      };
      return map[cat] || '📦';
    }

    function loadProducts() {
      db.ref('inventario').once('value').then(snap => {
        const data = snap.val() || {};
        allProducts = Object.entries(data).map(([id, p]) => ({
          id,
          nombre: p.nombre || 'Sin nombre',
          precio: Number(p.precio) || 0,
          stock: Number(p.stock) || 0,
          categoria: normalizeCategory(p.categoria),
          imagen: p.imagen || null
        })).filter(p => p.precio > 0);

        allProducts.sort((a, b) => {
          if (a.categoria === 'Tintas' && b.categoria !== 'Tintas') return -1;
          if (b.categoria === 'Tintas' && a.categoria !== 'Tintas') return 1;
          return a.nombre.localeCompare(b.nombre);
        });

        buildCategories();
        render();
      }).catch(() => {
        document.getElementById('productsGrid').innerHTML =
          `<div class="state"><div class="icon">⚠️</div><p>Error al cargar productos</p></div>`;
      });
    }

    function buildCategories() {
      const counts = {};
      allProducts.forEach(p => { counts[p.categoria] = (counts[p.categoria] || 0) + 1; });
      const cats = Object.keys(counts).sort();

      // Sidebar
      const side = document.getElementById('sidebarCats');
      side.innerHTML = `<div class="sidebar-cat active" data-cat=""><span>Todos</span><span class="count">${allProducts.length}</span></div>` +
        cats.map(c => `<div class="sidebar-cat" data-cat="${c}"><span>${c}</span><span class="count">${counts[c]}</span></div>`).join('');

      // Top chips
      const nav = document.getElementById('navCats');
      nav.innerHTML = `<div class="cat-chip active" data-cat="">Todos</div>` +
        cats.map(c => `<div class="cat-chip" data-cat="${c}">${c}</div>`).join('');

      // Events
      document.querySelectorAll('.sidebar-cat, .cat-chip').forEach(el => {
        el.addEventListener('click', () => {
          currentCat = el.dataset.cat;
          document.querySelectorAll('.sidebar-cat, .cat-chip').forEach(x => x.classList.remove('active'));
          document.querySelectorAll(`[data-cat="${currentCat}"]`).forEach(x => x.classList.add('active'));
          render();
        });
      });
    }

    function render() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const sort = document.getElementById('sortSelect').value;

      let list = allProducts.filter(p => {
        const matchQ = !q || p.nombre.toLowerCase().includes(q);
        const matchC = !currentCat || p.categoria === currentCat;
        return matchQ && matchC;
      });

      if (sort === 'price-asc') list.sort((a,b) => a.precio - b.precio);
      else if (sort === 'price-desc') list.sort((a,b) => b.precio - a.precio);
      else if (sort === 'stock') list.sort((a,b) => b.stock - a.stock);
      else list.sort((a,b) => a.nombre.localeCompare(b.nombre));

      document.getElementById('resultsCount').textContent =
        `${list.length} producto${list.length !== 1 ? 's' : ''}`;

      const grid = document.getElementById('productsGrid');
      if (!list.length) {
        grid.innerHTML = `<div class="state"><div class="icon">🔍</div><p>No se encontraron productos</p></div>`;
        return;
      }

      grid.innerHTML = list.map(p => {
        const inStock = p.stock > 0;
        const low = p.stock > 0 && p.stock <= 5;
        let tag = '';
        if (!inStock) tag = '<span class="stock-tag out">Agotado</span>';
        else if (low) tag = `<span class="stock-tag low">${p.stock} disp.</span>`;
        else tag = `<span class="stock-tag">${p.stock} disp.</span>`;

        return `
          <article class="product-card" style="cursor:pointer" onclick="location.href='product.html?id=${p.id}'">
            <div class="product-image">
              ${p.imagen 
                ? `<img src="${esc(p.imagen)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                   <span style="display:none;font-size:48px">${getIcon(p.categoria)}</span>`
                : getIcon(p.categoria)}
              ${tag}
            </div>
            <div class="product-body">
              <div class="product-category">${p.categoria}</div>
              <h3 class="product-name">${esc(p.nombre)}</h3>
              <div class="product-price">$${p.precio.toFixed(2)} <small>USD</small></div>
              <button class="btn-add" onclick="event.stopPropagation();addToCart('${p.id}')" ${!inStock ? 'disabled' : ''}>
                ${inStock ? 'Añadir a la cesta' : 'Agotado'}
              </button>
            </div>
          </article>`;
      }).join('');
    }

    function esc(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    // Cart
    function saveCart() {
      localStorage.setItem('graphitech_cart', JSON.stringify(cart));
      updateCartUI();
    }

    window.addToCart = function(id) {
      const p = allProducts.find(x => x.id === id);
      if (!p || p.stock <= 0) return;
      if (!cart[id]) cart[id] = { ...p, qty: 0 };
      if (cart[id].qty < p.stock) {
        cart[id].qty++;
        saveCart();
        showToast('✓ Añadido a la cesta');
      } else showToast('Stock máximo alcanzado');
    };

    window.changeQty = function(id, d) {
      if (!cart[id]) return;
      cart[id].qty += d;
      if (cart[id].qty <= 0) delete cart[id];
      else {
        const p = allProducts.find(x => x.id === id);
        if (p && cart[id].qty > p.stock) cart[id].qty = p.stock;
      }
      saveCart();
    };

    window.removeItem = function(id) {
      delete cart[id];
      saveCart();
    };

    function updateCartUI() {
      const items = Object.values(cart);
      const count = items.reduce((s,i) => s + i.qty, 0);
      const total = items.reduce((s,i) => s + i.precio * i.qty, 0);

      document.getElementById('cartCount').textContent = count;
      document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
      document.getElementById('checkoutBtn').disabled = count === 0;

      const body = document.getElementById('cartBody');
      if (!items.length) {
        body.innerHTML = `<div class="cart-empty">Tu carrito está vacío</div>`;
        return;
      }
      body.innerHTML = items.map(i => `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${esc(i.nombre)}</div>
            <div class="cart-item-price">$${i.precio.toFixed(2)} c/u</div>
            <div class="cart-item-controls">
              <button class="qty-btn" onclick="changeQty('${i.id}',-1)">−</button>
              <span class="qty-num">${i.qty}</span>
              <button class="qty-btn" onclick="changeQty('${i.id}',1)">+</button>
              <button class="remove-item" onclick="removeItem('${i.id}')">Eliminar</button>
            </div>
          </div>
        </div>`).join('');
    }

    function checkout() {
      const items = Object.values(cart);
      if (!items.length) return;
      let msg = `¡Hola Graphitech! 👋%0AQuiero hacer el siguiente pedido:%0A%0A`;
      items.forEach(i => {
        msg += `• ${i.nombre} x${i.qty} = $${(i.precio * i.qty).toFixed(2)}%0A`;
      });
      const total = items.reduce((s,i) => s + i.precio * i.qty, 0);
      msg += `%0A*Total: $${total.toFixed(2)} USD*%0A%0A¿Me confirman disponibilidad y forma de pago?`;
      window.open(`https://wa.me/50760023188?text=${msg}`, '_blank');
    }

    function showToast(txt) {
      const t = document.getElementById('toast');
      t.textContent = txt;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    // Events
    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('sortSelect').addEventListener('change', render);
    document.getElementById('openCart').addEventListener('click', () => document.getElementById('cartOverlay').classList.add('open'));
    document.getElementById('closeCart').addEventListener('click', () => document.getElementById('cartOverlay').classList.remove('open'));
    document.getElementById('cartOverlay').addEventListener('click', e => {
      if (e.target === document.getElementById('cartOverlay')) document.getElementById('cartOverlay').classList.remove('open');
    });
    document.getElementById('checkoutBtn').addEventListener('click', checkout);

    loadProducts();
    updateCartUI();
  </script>
</body>
</html>
